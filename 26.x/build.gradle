// Fabric visual mods reference
// Module: 26.x/build.gradle
// SPDX-License-Identifier: MIT

plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
}

version = "1.0.0"
group = "team.vixo"

base {
    archivesName = "vixoteam-26.2"
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.154.0+26.2"
    implementation project(":shared_render")
    include project(":shared_render")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

sourceSets.main.resources.srcDir project(":shared_render").file("src/main/resources")
