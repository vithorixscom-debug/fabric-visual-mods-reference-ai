name: verify

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_repository.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - run: chmod +x gradlew
      - name: build
        run: |
          printf '\norg.gradle.java.installations.paths=%s,%s\n' "$JAVA_HOME_21_X64" "$JAVA_HOME_25_X64" >> gradle.properties
          ./gradlew build --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: build VisualPrimer
        working-directory: VisualPrimer
        run: |
          chmod +x gradlew
          printf '\norg.gradle.java.installations.paths=%s,%s\n' "$JAVA_HOME_21_X64" "$JAVA_HOME_25_X64" >> gradle.properties
          ./gradlew build --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
